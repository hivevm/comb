<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comb · UML</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="canvas"></main>
    <aside id="sidebar">
      <h1>UML</h1>
      <label>
        Diagram
        <select id="diagram"></select>
      </label>
      <p id="count"></p>
      <section id="palette">
        <h2>Add a node</h2>
        <p>Drag a kind onto the canvas.</p>
        <ul id="palette-kinds"></ul>
      </section>
      <section id="node-form" hidden>
        <h2 id="node-heading">Selected node</h2>
        <label>
          Name
          <input id="name" aria-describedby="name-refusal" type="text" />
        </label>
        <p id="name-refusal" class="refusal" role="alert"></p>
        <label id="stereotype-field">
          Stereotype
          <input
            id="stereotype"
            aria-describedby="stereotype-refusal"
            type="text"
            placeholder="«interface»"
          />
        </label>
        <p id="stereotype-refusal" class="refusal" role="alert"></p>
        <label id="attributes-field">
          Attributes, one per line
          <textarea
            id="attributes"
            aria-describedby="attributes-refusal"
            rows="4"
            spellcheck="false"
          ></textarea>
        </label>
        <p id="attributes-refusal" class="refusal" role="alert"></p>
        <label id="operations-field">
          Operations, one per line
          <textarea
            id="operations"
            aria-describedby="operations-refusal"
            rows="4"
            spellcheck="false"
          ></textarea>
        </label>
        <p id="operations-refusal" class="refusal" role="alert"></p>
      </section>
      <section id="edge-form" hidden>
        <h2 id="edge-heading">Selected relationship</h2>
        <label id="kind-field">
          Kind
          <select id="kind"></select>
        </label>
        <label id="dependency-field">
          Dependency
          <select id="dependency" aria-describedby="dependency-refusal">
            <option>«import»</option>
            <option>«use»</option>
          </select>
        </label>
        <p id="dependency-refusal" class="refusal" role="alert"></p>
        <label id="label-field">
          Label
          <input id="label" aria-describedby="label-refusal" type="text" />
        </label>
        <p id="label-refusal" class="refusal" role="alert"></p>
        <label id="event-field">
          Event
          <input id="event" aria-describedby="event-refusal" type="text" placeholder="destroy" />
        </label>
        <p id="event-refusal" class="refusal" role="alert"></p>
      </section>
      <p id="empty">Select a node or an edge to edit it here; Delete removes it.</p>
      <section id="legend">
        <h2>Relationships</h2>
        <ul id="legend-kinds"></ul>
      </section>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
