<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comb · UML</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="canvas"></main>
    <aside id="sidebar">
      <h1>UML</h1>
      <label>
        Diagram
        <select id="diagram">
          <option value="class">Class diagram</option>
          <option value="package">Package diagram</option>
          <option value="state">State diagram</option>
        </select>
      </label>
      <p id="count"></p>
      <section id="palette">
        <h2>Add a node</h2>
        <p>Drag a kind onto the canvas.</p>
        <ul>
          <li draggable="true" data-kind="class" data-diagram="class">Class</li>
          <li draggable="true" data-kind="interface" data-diagram="class">Interface</li>
          <li draggable="true" data-kind="abstract-class" data-diagram="class">Abstract class</li>
          <li draggable="true" data-kind="package" data-diagram="package" hidden>Package</li>
          <li draggable="true" data-kind="state" data-diagram="state" hidden>State</li>
          <li draggable="true" data-kind="initial" data-diagram="state" hidden>Initial state</li>
          <li draggable="true" data-kind="final" data-diagram="state" hidden>Final state</li>
          <li draggable="true" data-kind="choice" data-diagram="state" hidden>Choice</li>
        </ul>
      </section>
      <section id="node-form" hidden>
        <h2 id="node-heading">Selected node</h2>
        <label>
          Name
          <input id="name" type="text" />
        </label>
        <label id="stereotype-field">
          Stereotype
          <input id="stereotype" type="text" placeholder="«interface»" />
        </label>
        <label id="attributes-field">
          Attributes, one per line
          <textarea id="attributes" rows="4" spellcheck="false"></textarea>
        </label>
        <label id="operations-field">
          Operations, one per line
          <textarea id="operations" rows="4" spellcheck="false"></textarea>
        </label>
      </section>
      <section id="edge-form" hidden>
        <h2 id="edge-heading">Selected relationship</h2>
        <label id="kind-field">
          Kind
          <select id="kind"></select>
        </label>
        <label id="dependency-field">
          Dependency
          <select id="dependency">
            <option>«import»</option>
            <option>«use»</option>
          </select>
        </label>
        <label id="label-field">
          Label
          <input id="label" type="text" />
        </label>
        <label id="event-field">
          Event
          <input id="event" type="text" placeholder="destroy" />
        </label>
      </section>
      <p id="empty">Select a node or an edge to edit it here; Delete removes it.</p>
      <section id="legend">
        <h2>Relationships</h2>
        <ul id="legend-kinds"></ul>
      </section>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
