<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comb · UML</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="canvas"></main>
    <aside id="sidebar">
      <h1>UML</h1>
      <label>
        Diagram
        <select id="diagram">
          <option value="class">Class diagram</option>
        </select>
      </label>
      <p id="count"></p>
      <section id="palette">
        <h2>Add a classifier</h2>
        <p>Drag a kind onto the canvas.</p>
        <ul>
          <li draggable="true" data-kind="class">Class</li>
          <li draggable="true" data-kind="interface">Interface</li>
          <li draggable="true" data-kind="abstract-class">Abstract class</li>
        </ul>
      </section>
      <section id="node-form" hidden>
        <h2>Selected classifier</h2>
        <label>
          Name
          <input id="name" type="text" />
        </label>
        <label>
          Stereotype
          <input id="stereotype" type="text" placeholder="«interface»" />
        </label>
        <label>
          Attributes, one per line
          <textarea id="attributes" rows="4" spellcheck="false"></textarea>
        </label>
        <label>
          Operations, one per line
          <textarea id="operations" rows="4" spellcheck="false"></textarea>
        </label>
      </section>
      <section id="edge-form" hidden>
        <h2>Selected relationship</h2>
        <label>
          Kind
          <select id="kind"></select>
        </label>
        <label>
          Label
          <input id="label" type="text" />
        </label>
      </section>
      <p id="empty">Select a classifier or a relationship to edit it here; Delete removes it.</p>
      <section id="legend">
        <h2>Relationships</h2>
        <ul id="legend-kinds"></ul>
      </section>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
