<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comb · metric tree</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="canvas"></main>
    <aside id="sidebar">
      <h1>Metric tree</h1>
      <label>
        Copies of the tree
        <select id="copies">
          <option value="1">1</option>
          <option value="10">10</option>
          <option value="100">100</option>
          <option value="1000">1000</option>
          <option value="3334">3334 (50,010 nodes)</option>
        </select>
      </label>
      <p id="count"></p>
      <section id="palette">
        <h2>Add a node</h2>
        <p>Drag a kind onto the canvas.</p>
        <ul>
          <li draggable="true" data-kind="bet">Bet</li>
          <li draggable="true" data-kind="epic">Epic</li>
          <li draggable="true" data-kind="input-metric">Input metric</li>
          <li draggable="true" data-kind="kpi">KPI</li>
        </ul>
      </section>
      <section id="selection" hidden>
        <h2>Selected node</h2>
        <p id="node-type"></p>
        <label>
          Title
          <input id="title" type="text" />
        </label>
        <label id="hypothesis-field" hidden>
          Hypothesis
          <input id="hypothesis" type="text" />
        </label>
        <label id="progress-field" hidden>
          Progress (%)
          <input id="progress" type="number" min="0" max="100" step="1" />
        </label>
        <label id="status-field" hidden>
          Status
          <select id="status"></select>
        </label>
        <div id="periods"></div>
      </section>
      <section id="edge-selection" hidden>
        <h2>Selected edge</h2>
        <label>
          Colour
          <input id="edge-color" type="color" />
        </label>
        <label>
          Line
          <select id="edge-dash">
            <option value="solid">Solid</option>
            <option value="dashed">Dashed</option>
          </select>
        </label>
        <label class="inline">
          <input id="edge-arrow" type="checkbox" />
          Arrowhead
        </label>
        <label>
          Label
          <input id="edge-label" type="text" />
        </label>
      </section>
      <p id="empty">Select a node or an edge on the canvas to edit it here.</p>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
