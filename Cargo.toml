# The engine: a pure core and its WebAssembly bridge (ARCH-one-workspace-per-example).
[workspace]
resolver = "3"
members = ["crates/engine", "crates/engine-wasm"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Maintainability sensors of DEV-bun-vite-wasm-pack, as errors; thresholds in clippy.toml.
[workspace.lints.rust]
dead_code = "deny"

[workspace.lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"
# Every narrowing outside the tests says why it holds, by a checked conversion or an `expect`
# whose reason names what bounds the value, since a narrowing written without a look at its range
# can lose what Q-4 or Q-7 needs (docs/CONVENTIONS.md, *Check a value as the engine keeps it*). Dev
# tooling within DEV-bun-vite-wasm-pack; each crate root allows it in test code, under
# `cfg(test)`.
cast_possible_truncation = "deny"
# A mutation of the graph whose result `let _ =` drops hides the failure it reports: each such
# result is a refusal or an `unreachable!` that names why it cannot fail (docs/CONVENTIONS.md,
# *A graph mutation's failure is handled*). Dev tooling within DEV-bun-vite-wasm-pack.
let_underscore_must_use = "deny"

[profile.release]
lto = true
codegen-units = 1
