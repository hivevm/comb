# The engine: a pure core and its WebAssembly bridge (ADR-0026).
[workspace]
resolver = "3"
members = ["crates/engine", "crates/engine-wasm"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Maintainability sensors of ADR-0008, as errors; thresholds in clippy.toml.
[workspace.lints.rust]
dead_code = "deny"

[workspace.lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"

[profile.release]
lto = true
codegen-units = 1
