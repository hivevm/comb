name: Benchmark

# The benchmark of Q-1 and Q-2 as a workflow of its own (ADR-0008): bench/run.ts at 50,010 nodes and
# edges on a GitHub runner, headless Chromium with WebGL2 on SwiftShader. Runner numbers are not the
# reference machine's: they catch regressions against a baseline recorded on a runner, not the
# targets. One run scatters, so the benchmark runs three times; bench/compare.ts fails when the
# median of a number exceeds the baseline of the runner's kind, its CPU model, under
# bench/baselines/ by more than its margin, and names it. A run on a kind without a baseline is
# refused, naming the kind, not passed. Within a kind runners differ in state, so each run also
# times a fixed reference workload, and the comparison is refused when a part of it differs from
# the baseline's by more than the margin; against a baseline that has no reference it compares and
# says the runner gate is not checked. It does all of this for each graph the benchmark measures
# (ADR-0033): the metric tree, and the shaped graph of node shapes, docking, and loops, each
# compared with its own baseline, bench/baselines/<kind>.json and <kind>.shaped.json; the shaped
# graph gates the job only where its kind has a baseline, and is otherwise reported. The runs and
# their medians are uploaded as an artefact; a kind's baseline changes only in a pull request that
# says why, from the median of a run on main.
#
# It runs weekly and on demand, not on every pull request: a run takes minutes, and runner numbers
# scatter too much to gate each change. It needs no secret (ADR-0016); every action it uses is
# pinned by commit SHA (ADR-0017), and its checkout keeps no credentials.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    # Thirteen gestures a run, each up to bench/run.ts's 30 s, three runs of each of two graphs, and
    # the build: about an hour.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # The runner image ships rustup; the toolchain is the one the Dev Container installs.
      - name: Set up Rust stable with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown
          rustup default stable
      - name: Install dependencies and Chromium
        run: |
          bun install --frozen-lockfile
          bunx --bun playwright install --with-deps chromium
      - name: Build the engine and the example
        run: |
          bun run build:engine
          bun run --cwd examples/metric-tree build
      - name: Run the benchmark three times at 50,010 nodes and edges
        run: |
          for i in 1 2 3; do
            bun --bun bench/run.ts
            cp bench-results/latest.json "bench-results/run-$i.json"
          done
      # Verifies: ADR-0010, ADR-0008 — the median first frame of the runner's kind stays within the
      # margin of its baseline, so a load that grows slow again is found at the next run.
      - name: Compare the median with the baseline of the runner's kind
        run: bun bench/compare.ts bench/baselines bench-results/run-*.json
      # After the metric tree's comparison, so that a shaped run that fails cannot skip it; and
      # whether that comparison passes or not, so that both graphs are reported (ADR-0033).
      - name: Run the benchmark three times on the shaped graph
        if: ${{ !cancelled() }}
        env:
          BENCH_GRAPH: shaped
        run: |
          for i in 1 2 3; do
            bun --bun bench/run.ts
            cp bench-results/latest.json "bench-results/shaped-$i.json"
          done
      # Verifies: ADR-0033 — compared whether the metric tree's comparison passes or not, so that
      # both are reported. It gates the job only where the shaped graph's baseline exists on the
      # runner's kind: where none does (exit 3), it reports the median and the file the baseline
      # would be saved as, and passes, so that the job fails on the metric tree alone.
      - name: Compare the shaped graph's median with its baseline of the runner's kind
        if: ${{ !cancelled() }}
        run: |
          status=0
          bun bench/compare.ts bench/baselines bench-results/shaped-*.json || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::notice::The shaped graph has no baseline on this kind: not gated; its median" \
              "is median.shaped.json in the artefact, its baseline's file named above."
            { echo "### The shaped graph's median, not compared"; echo '```json'; cat bench-results/median.shaped.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
      # Uploaded whether the comparisons pass or not, so a regression can be read and a new
      # baseline taken from median.json or median.shaped.json.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: error
